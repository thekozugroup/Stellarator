[workspace]
resolver = "2"
members = ["crates/api", "crates/core", "crates/engine", "crates/import", "crates/export", "crates/server", "crates/mock"]
exclude = ["desktop"]
# The desktop app (desktop/src-tauri) is its own workspace so its heavy dependencies don't slow
# down server builds; it depends on crates/server by path.

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
# 1.89: std::fs::File::try_lock (the data folder lock, crates/core/src/datalock.rs).
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
