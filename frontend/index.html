<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stellarator" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Collect thinking traces, responses and preference pairs from any OpenAI-compatible endpoint." />
    <script>
      // Apply the saved theme before the first paint (see src/lib/theme.tsx).
      try {
        var t = localStorage.getItem("theme")
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", d)
        document.documentElement.style.colorScheme = d ? "dark" : "light"
      } catch (e) {}
    </script>
    <title>Stellarator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
