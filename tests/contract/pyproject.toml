[project]
name = "stellarator-contract-tests"
version = "0.1.0"
description = "Black-box HTTP contract tests for the Stellarator API (Python and Rust backends)"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8",
  "httpx>=0.27",
  "pyarrow>=17",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
markers = [
  "v2: behaviour added by the Rust port (background imports, presets, status fields); fails on the Python backend",
  "v1: Python-only behaviour (for example POST /api/imports answering 201 synchronously); deselect on Rust with -m 'not v1'",
  "slow: waits for a run to finish",
]
