[package]
name = "stellarator-api"
description = "The Stellarator API's request and response types, with no server dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Serde types only: this crate builds for wasm32 too (the nsh app's web build). No sqlx, tokio,
# axum or reqwest here; validation that needs the server's error type stays in stellarator-core.
[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
