[package]
name = "stellarator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
form_urlencoded = "1.2.2"
futures = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "json", "stream", "system-proxy", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
stellarator-api = { version = "0.3.1", path = "../api" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }
