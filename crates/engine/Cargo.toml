[package]
name = "stellarator-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
fastrand = "2.5.0"
futures = "0.3.34"
parking_lot = "0.12.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream", "system-proxy", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json"] }
stellarator-core = { version = "0.3.1", path = "../core" }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
stellarator-mock = { path = "../mock" }
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
