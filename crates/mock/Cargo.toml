[package]
name = "stellarator-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stellarator-mock"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
fastrand = "2.5.0"
futures = "0.3.34"
# The official Rust MCP SDK, for the mock MCP server (streamable HTTP and stdio).
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
stellarator-core = { path = "../core" }
stellarator-mcp = { path = "../mcp" }
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
