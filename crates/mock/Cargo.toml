[package]
name = "stellarator-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stellarator-mock"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
fastrand = "2.5.0"
futures = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
