[package]
name = "stellarator-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
serde_json = "1.0.154"
stellarator-core = { version = "0.2.0", path = "../core" }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
