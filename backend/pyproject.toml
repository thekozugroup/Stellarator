[project]
name = "stellarator"
version = "0.1.0"
description = "Distillation and preference data collection from OpenAI-compatible endpoints"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "pyarrow>=17",
  "huggingface_hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stellarator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
