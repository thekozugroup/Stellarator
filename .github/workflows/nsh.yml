# The nsh app (app/): the native Stellarator app on nsh (Native Shell), built, packaged, launched
# and screenshotted on macOS 26, Windows and Linux: the window's shape, fonts, dark mode, memory,
# every component on one screen (Linux), and the app's unit tests. The installers and releases are
# release-nsh.yml's.
#
# The web job builds the same app for the browser (`nsh package --target web`): the screens reach
# the API at the page's own origin.
#
# Each desktop job packages the app with `nsh package` (which builds a runner around app/'s crate), seeds a
# data folder with sample runs (app/ci/seed.py) after the first launch, and uploads screenshots,
# logs and packages as artifacts. The app prints `probe:` lines with STELLARATOR_PROBE=1
# (app/src/platform/mod.rs).
#
# Triggered only by app/ and this file, so it never starts the Desktop workflow.

name: nsh app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/nsh.yml"
  workflow_dispatch:

concurrency:
  group: nsh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NSH_VERSION: v0.6.1
  CARGO_TERM_COLOR: always
  # One target folder for `cargo` and the runners `nsh package` generates (it honors this).
  CARGO_TARGET_DIR: ${{ github.workspace }}/app/target

jobs:
  macos:
    name: macOS 26 (Intel)
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nsh-macos
          cache-on-failure: true
          workspaces: app -> target

      - name: Install nsh
        run: |
          # Download first, with retries: `curl | sh` would run an empty script if the download failed.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          sh "$RUNNER_TEMP/nsh-install.sh"
          "$HOME/.local/bin/nsh" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Compile the Icon Composer document (app/icon-src) with actool; when it works, nsh.json's
      # macos.infoPlist names the icon and Assets.car goes into the app below.
      - name: Liquid Glass icon (actool)
        id: glass
        run: |
          out="$RUNNER_TEMP/icon-build"
          mkdir -p "$out"
          xcrun actool --version || true
          if xcrun actool app/icon-src/Stellarator.icon --compile "$out" \
              --output-format human-readable-text --notices --warnings --errors \
              --output-partial-info-plist "$out/partial.plist" --app-icon Stellarator \
              --include-all-app-icons --enable-on-demand-resources NO --development-region en \
              --target-device mac --minimum-deployment-target 14.0 --platform macosx \
            && [ -s "$out/Assets.car" ]; then
            python3 - <<'PY'
          import json
          path = "app/nsh.json"
          config = json.load(open(path))
          config.setdefault("macos", {}).setdefault("infoPlist", {})["CFBundleIconName"] = "Stellarator"
          json.dump(config, open(path, "w"), indent=2)
          PY
            echo "car=$out/Assets.car" >> "$GITHUB_OUTPUT"
            ls -la "$out"
          else
            echo "::warning::actool could not compile Stellarator.icon; the app keeps the static icon."
          fi

      - name: Package (nsh package --target macos)
        working-directory: app
        run: |
          # Start the generated runner workspace from app/'s lock file, so the server's
          # dependencies stay at the versions the root workspace tests.
          mkdir -p .nsh/rust && cp Cargo.lock .nsh/rust/Cargo.lock
          start=$(date +%s)
          nsh package --target macos
          echo "nsh package took $(( $(date +%s) - start )) s"
          ls -la .nsh/out

      - name: Icon post-process, signature and DMG
        env:
          CAR: ${{ steps.glass.outputs.car }}
        run: |
          app="app/.nsh/out/Stellarator.app"
          if [ -n "$CAR" ]; then
            cp "$CAR" "$app/Contents/Resources/Assets.car"
          fi
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          echo "CFBundleIconName: $(defaults read "$PWD/$app/Contents/Info" CFBundleIconName 2>&1)"
          echo "CFBundleIconFile: $(defaults read "$PWD/$app/Contents/Info" CFBundleIconFile 2>&1)"
          ls -la "$app/Contents/Resources" "$app/Contents/MacOS"
          du -sh "$app"
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on the hosted runners: try again.
          for attempt in 1 2 3; do
            hdiutil create -volname Stellarator -srcfolder dmg -ov -format UDZO Stellarator-nsh-x64.dmg && break
            sleep 10
          done
          ls -la Stellarator-nsh-x64.dmg

      - name: Window and mouse helpers
        run: |
          swiftc -O app/ci/window-id.swift -o "$RUNNER_TEMP/window-id"
          swiftc -O app/ci/mouse-drag.swift -o "$RUNNER_TEMP/mouse-drag"
          swiftc -O app/ci/icon-of.swift -o "$RUNNER_TEMP/icon-of"

      - name: Run (light, empty data folder, then seeded, then without the toolbar)
        run: |
          app="$PWD/app/.nsh/out/Stellarator.app"
          data="$RUNNER_TEMP/data"
          out="$PWD/shots"
          defaults delete -g AppleInterfaceStyle 2> /dev/null || true
          app/ci/macos-session.sh light-empty "$app" "$data" "$out" "$RUNNER_TEMP/window-id"
          python3 app/ci/seed.py "$data"
          app/ci/macos-session.sh light "$app" "$data" "$out" "$RUNNER_TEMP/window-id"
          app/ci/macos-session.sh light-no-toolbar "$app" "$data" "$out" "$RUNNER_TEMP/window-id" STELLARATOR_NO_TOOLBAR=1

      # Opened through Launch Services (as from the Finder), so the app shows in the Dock with its
      # icon in the screen shot.
      - name: Run (opened with open, as from the Finder)
        env:
          LAUNCHER: open
        run: |
          app/ci/macos-session.sh light-open "$PWD/app/.nsh/out/Stellarator.app" "$RUNNER_TEMP/data" "$PWD/shots" "$RUNNER_TEMP/window-id"

      # Dark mode the way the user turns it on (System Settings > Appearance), through System
      # Events. `defaults write -g AppleInterfaceStyle` and the app's argument domain
      # (-AppleInterfaceStyle Dark) did not change the appearance AppKit reports on this runner.
      - name: Run (dark)
        run: |
          app="$PWD/app/.nsh/out/Stellarator.app"
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || echo "could not switch to dark mode"
          echo "dark mode: $(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode' 2>&1)"
          app/ci/macos-session.sh dark "$app" "$RUNNER_TEMP/data" "$PWD/shots" "$RUNNER_TEMP/window-id"
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true

      - name: Drag the window by its top band
        run: |
          app/ci/macos-drag.sh "$PWD/app/.nsh/out/Stellarator.app" "$RUNNER_TEMP/data" "$PWD/shots" "$RUNNER_TEMP/window-id" "$RUNNER_TEMP/mouse-drag"

      - name: Menu bar, one copy per data folder, the window's place
        timeout-minutes: 6
        run: |
          app/ci/macos-desktop.sh "$PWD/app/.nsh/out/Stellarator.app" "$RUNNER_TEMP/data" "$PWD/shots" "$RUNNER_TEMP/window-id" "$RUNNER_TEMP/mouse-drag"

      # Last, and bounded: in an earlier run this step did not return within 18 minutes.
      - name: The icon macOS shows for the app
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p shots
          perl -e 'alarm 60; exec @ARGV' "$RUNNER_TEMP/icon-of" "$PWD/app/.nsh/out/Stellarator.app" shots/app-icon.png 512 \
            || echo "icon-of did not finish within 60 s (exit $?)"
          perl -e 'alarm 60; exec @ARGV' xcrun assetutil --info "$PWD/app/.nsh/out/Stellarator.app/Contents/Resources/Assets.car" > shots/assets-car-info.json 2>&1 \
            || echo "assetutil did not finish within 60 s (exit $?)"
          grep -E '"(Name|RenditionName|AssetType)"' shots/assets-car-info.json | sort | uniq -c | head -20 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nsh-macos
          if-no-files-found: warn
          path: |
            shots/
            Stellarator-nsh-x64.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # aws-lc-sys (rustls, in the server's HTTP client) uses its prebuilt assembly without NASM.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nsh-windows
          cache-on-failure: true
          workspaces: app -> target

      - name: Install nsh
        shell: pwsh
        run: |
          # Retries: a runner can briefly fail to resolve nsh.dev.
          $script = $null
          foreach ($i in 1..5) { try { $script = irm https://nsh.dev/install.ps1; break } catch { if ($i -eq 5) { throw }; Start-Sleep 10 } }
          iex $script
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:LOCALAPPDATA\nsh\bin\nsh.exe" --version

      - name: Package (nsh package --target windows)
        shell: bash
        working-directory: app
        run: |
          mkdir -p .nsh/rust && cp Cargo.lock .nsh/rust/Cargo.lock
          start=$(date +%s)
          nsh package --target windows
          echo "nsh package took $(( $(date +%s) - start )) s"
          ls -la .nsh/out .nsh/out/Stellarator

      - name: Run (empty data folder, then seeded)
        shell: pwsh
        run: |
          $exe = "$PWD\app\.nsh\out\Stellarator\Stellarator.exe"
          $data = "$env:RUNNER_TEMP\data"
          & app\ci\windows-session.ps1 -Name empty -Exe $exe -Data $data -Out "$PWD\shots"
          python app\ci\seed.py $data
          & app\ci\windows-session.ps1 -Name runs -Exe $exe -Data $data -Out "$PWD\shots"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nsh-windows
          if-no-files-found: warn
          path: |
            shots/
            app/.nsh/out/*.zip
            app/.nsh/out/*-setup.exe

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build and run dependencies (GTK 4, GStreamer, a virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev clang libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            xvfb imagemagick
          pkg-config --modversion gtk4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nsh-linux
          cache-on-failure: true
          workspaces: app -> target

      - name: Install nsh
        run: |
          # Download first, with retries: `curl | sh` would run an empty script if the download failed.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          sh "$RUNNER_TEMP/nsh-install.sh"
          "$HOME/.local/bin/nsh" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package (nsh package --target linux)
        working-directory: app
        run: |
          mkdir -p .nsh/rust && cp Cargo.lock .nsh/rust/Cargo.lock
          start=$(date +%s)
          nsh package --target linux
          echo "nsh package took $(( $(date +%s) - start )) s"
          ls -la .nsh/out .nsh/out/Stellarator

      - name: Run (empty, seeded light, seeded dark)
        run: |
          exe="$PWD/app/.nsh/out/Stellarator/Stellarator"
          data="$RUNNER_TEMP/data"
          out="$PWD/shots"
          screen="-screen 0 1440x900x24"
          xvfb-run -a -s "$screen" app/ci/linux-session.sh empty "$exe" "$data" "$out"
          python3 app/ci/seed.py "$data"
          xvfb-run -a -s "$screen" app/ci/linux-session.sh light "$exe" "$data" "$out"
          # Dark: GTK's own setting, which nsh reads at start when no desktop portal answers.
          mkdir -p "$RUNNER_TEMP/xdg-dark/gtk-4.0"
          printf '[Settings]\ngtk-application-prefer-dark-theme=1\n' > "$RUNNER_TEMP/xdg-dark/gtk-4.0/settings.ini"
          xvfb-run -a -s "$screen" app/ci/linux-session.sh dark "$exe" "$data" "$out" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-dark"
          # Every component on one screen (src/screens/gallery.rs).
          xvfb-run -a -s "$screen" app/ci/linux-session.sh gallery "$exe" "$data" "$out" STELLARATOR_GALLERY=1

      - name: Unit tests (formatting, the router, the pixel tile, the API client)
        working-directory: app
        run: cargo test --lib --locked

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nsh-linux
          if-no-files-found: warn
          path: |
            shots/
            app/.nsh/out/*.tar.gz

  web:
    name: Web (nsh package --target web)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # `nsh package` also builds the app's crate for this machine (to describe its UI), which
      # links GTK 4 on Linux; the WebAssembly runtime needs clang and llvm-ar (docs/web).
      - name: Build dependencies (GTK 4, clang, llvm-ar)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev clang llvm
          llvm-ar --version | head -n 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: nsh-web
          cache-on-failure: true
          workspaces: app -> target

      - name: Install nsh
        run: |
          # Download first, with retries: `curl | sh` would run an empty script if the download failed.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          sh "$RUNNER_TEMP/nsh-install.sh"
          "$HOME/.local/bin/nsh" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package (nsh package --target web)
        working-directory: app
        run: |
          mkdir -p .nsh/rust && cp Cargo.lock .nsh/rust/Cargo.lock
          start=$(date +%s)
          nsh package --target web
          echo "nsh package took $(( $(date +%s) - start )) s"
          ls -la .nsh/out .nsh/out/Stellarator
          du -sh .nsh/out/Stellarator
          for f in .nsh/out/Stellarator/*.wasm; do
            echo "$f: $(wc -c < "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nsh-web
          if-no-files-found: warn
          path: app/.nsh/out/Stellarator/
