# Desktop app installers (Tauri 2): macOS (Apple Silicon first), Windows and Linux. The nsh app's
# installers (release-nsh.yml) are to replace these. Until the switch this workflow makes the
# releases; once release-nsh.yml has PUBLISH: "true", it only builds the installers as artifacts,
# so one version is never published by both (docs/desktop.md, "The nsh app").
#
# Every run uploads the installers as workflow artifacts. A GitHub release tagged
# v<version in Cargo.toml> is made by:
#   - a push to main whose version has no published release yet (bump the version to release),
#   - Run workflow with "Publish a release" checked,
#   - a v* tag push.
# One draft is created first, the four builds upload into it, and it is published (and marked
# latest) only when all of them succeed, so a partial release is never visible. Publishing creates
# the tag on the run's commit if it does not exist yet.
#
# macOS signing and notarization are optional. Without the secrets below the app is ad-hoc
# signed and users open it as described in docs/desktop.md. To sign and notarize, add these
# repository secrets (all of them):
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD  the .p12 password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: The Kozu Group (TEAMID1234)"
#   APPLE_ID                    the Apple ID used for notarization
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               the 10-character team ID
#
# In-app updates are optional too. With all three of these repository secrets set, the build turns
# the updater on (a config overlay with the public key and the endpoint), signs the update bundles
# and uploads latest.json into the release; the app then checks
# https://github.com/<this repo>/releases/latest/download/latest.json. Without them the builds are
# the same as before and the app has no updater. Generate the key pair as docs/desktop.md shows.
#   TAURI_SIGNING_PRIVATE_KEY           the private key (the contents of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   TAURI_UPDATER_PUBKEY                the public key (the contents of the .key.pub file)

name: Desktop

on:
  push:
    tags: ["v*"]
    branches: [main]
    # Branch pushes only; tag pushes always run.
    paths:
      - "desktop/**"
      - "crates/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (tag v<version in Cargo.toml>) with the installers
        type: boolean
        default: false

concurrency:
  # Release runs get their own group, so a later push to main neither cancels nor queues them.
  group: desktop-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}

permissions:
  contents: write # the release

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Desktop version equals the workspace version (and the tag)
        id: check
        run: |
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          desktop=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -n 1)
          echo "workspace $workspace, desktop $desktop"
          # After the switch the nsh app is released, and the workspace version moves on without
          # this app: build the installers, compare nothing, publish nothing.
          if grep -qE '^  PUBLISH: "true"' .github/workflows/release-nsh.yml; then
            echo "Releases come from release-nsh.yml (the nsh app): this run only builds the Tauri installers."
            echo "version=$desktop" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "$workspace" != "$desktop" ]; then
            echo "::error file=desktop/src-tauri/Cargo.toml::version is $desktop; the workspace (Cargo.toml) is $workspace. Make them equal."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$desktop" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $desktop"
            exit 1
          fi
          echo "version=$desktop" >> "$GITHUB_OUTPUT"

  release:
    name: Create the draft release
    # Pushes to main and tags, or Run workflow with "Publish a release" checked; not after the
    # switch to release-nsh.yml.
    if: needs.version.outputs.publish == 'true' && (github.event_name == 'push' || inputs.release)
    needs: version
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      # For this version's section of CHANGELOG.md.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          # A tag or the checkbox asked for this release; a push to main only offers it.
          EXPLICIT: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
        run: |
          version="$VERSION"
          tag="v$version"
          cat > body.md <<'EOF'
          ## Download

          | Computer | File |
          | --- | --- |
          | Mac with Apple Silicon (M1 or later) | `Stellarator_@V@_aarch64.dmg` |
          | Mac with Intel | `Stellarator_@V@_x64.dmg` |
          | Windows 10 or 11 | `Stellarator_@V@_x64-setup.exe` (or the `.msi`) |
          | Linux (Ubuntu 22.04+, Debian 12+) | `Stellarator_@V@_amd64.AppImage` or `.deb` |

          ## macOS: the first open

          The app is not notarized yet, so macOS blocks the first open. Open the `.dmg`, drag
          Stellarator to Applications, then run this once in Terminal:

              xattr -dr com.apple.quarantine /Applications/Stellarator.app

          Or open the app once, then click Open Anyway in System Settings > Privacy & Security.

          ## Windows: the first open

          SmartScreen warns about an unsigned app: click More info, then Run anyway.

          Setup, data folders and troubleshooting: [docs/desktop.md](https://github.com/thekozugroup/Stellarator/blob/main/docs/desktop.md).
          EOF
          sed -i "s/@V@/$version/g" body.md
          # What's new: the "## <version>" section of CHANGELOG.md, up to the next "## " heading.
          if [ -f CHANGELOG.md ]; then
            awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md \
              | sed 's/^### /#### /' > notes.md
            if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
              { printf "## What's new\n"; cat notes.md; printf "\n"; cat body.md; } > body.new && mv body.new body.md
            fi
          fi
          # This version's releases: by tag, or drafts by name (GitHub drops a draft's tag when it
          # is updated without tag_name, leaving "untagged-..."). A published one is final: a push
          # to main then only builds the installers; a tag or the checkbox fails, since a new
          # release needs a new version. A draft left by an earlier (cancelled or failed) run is
          # moved to this commit and reused, and duplicate drafts are deleted. Otherwise create one.
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\" or (.draft and .name == \"Stellarator $tag\")) | \"\(.id) \(.draft)\"")
          if grep -q ' false$' <<<"$found"; then
            if [ "$EXPLICIT" = "true" ]; then
              echo "::error::Release $tag is already published. Bump the version in Cargo.toml, desktop/src-tauri/Cargo.toml and desktop/package.json."
              exit 1
            fi
            echo "Release $tag is already published; this run only builds the installers."
            exit 0
          fi
          id=""
          while read -r rid _; do
            [ -n "$rid" ] || continue
            if [ -z "$id" ]; then
              id="$rid"
            else
              echo "Deleting duplicate draft $rid"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$rid" --silent
            fi
          done <<<"$found"
          if [ -n "$id" ]; then
            # Always send tag_name with an update (see above).
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --silent
          fi
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Stellarator $tag" \
              -F draft=true -F body=@body.md --jq .id)
          fi
          echo "Release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [version, release]
    # Branch pushes skip the release job; build anyway unless something failed.
    if: ${{ !cancelled() && !failure() }}
    # The Intel Mac build is optional: if it fails or times out, the release is still published
    # without its .dmg (Apple Silicon first). Every other build must succeed.
    continue-on-error: ${{ matrix.optional == true }}
    # A hung build (an Intel Mac build once ran 50+ minutes against 23 for the same work on the
    # same runner type) fails here instead of holding the release for GitHub's 6-hour default.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac builds run on the Intel runner and the Apple Silicon one is cross-compiled
          # (Rust and Tauri support this). In November 2026 jobs on the arm64 runners (macos-latest,
          # macos-26) sat queued until GitHub cancelled them: "Due to capacity constraints, jobs
          # targeting macOS arm64 runners may experience longer queue times." The Intel runners are
          # a separate pool. Labels get retired (macos-14 was on 2026-11-02); see
          # https://github.com/actions/runner-images for the current ones.
          - name: macOS (Apple Silicon)
            os: macos-26-intel
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-26-intel
            target: x86_64-apple-darwin
            optional: true
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Keep compiled dependencies even when a later step fails (a network error once failed
          # an upload after a 30-minute build, and the next run had to compile everything again).
          cache-on-failure: true
          workspaces: |
            desktop/src-tauri -> target
            . -> target

      - name: Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Use the Apple signing secrets if they are set
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Exported only when set: an empty APPLE_SIGNING_IDENTITY would replace the ad-hoc
          # identity ("-") in tauri.conf.json and fail the build.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Apple certificate: the app is ad-hoc signed and not notarized."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
            fi
          done
          echo "Signing with the Developer ID certificate; notarizing when APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are set."

      # macOS 26 draws Liquid Glass app icons itself, from an Icon Composer document compiled
      # into the app's asset catalog. Tauri bundles .icns only, so actool (Xcode 26) compiles
      # desktop/icon-src/Stellarator.icon here; the build adds Assets.car through a config overlay
      # and Info.plist names the icon. If actool fails, the app keeps the static icon.icns.
      - name: Liquid Glass icon (macOS 26)
        id: glass
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          out="$RUNNER_TEMP/icon-build"
          mkdir -p "$out"
          xcrun actool --version || true
          if xcrun actool ../icon-src/Stellarator.icon --compile "$out" \
              --output-format human-readable-text --notices --warnings --errors \
              --output-partial-info-plist "$out/partial.plist" --app-icon Stellarator \
              --include-all-app-icons --enable-on-demand-resources NO --development-region en \
              --target-device mac --minimum-deployment-target 12.0 --platform macosx \
            && [ -s "$out/Assets.car" ]; then
            cp "$out/Assets.car" icons/Assets.car
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string Stellarator" Info.plist
            printf '{"bundle":{"macOS":{"files":{"Resources/Assets.car":"icons/Assets.car"}}}}' > "$RUNNER_TEMP/glass.json"
            echo "args=--config $RUNNER_TEMP/glass.json" >> "$GITHUB_OUTPUT"
            ls -la "$out"
            xcrun assetutil --info icons/Assets.car | head -60 || true
          else
            echo "::warning::actool could not compile Stellarator.icon; this build uses the static icon.icns."
          fi

      # In-app updates, only with all three secrets (see the top of this file). The overlay adds
      # plugins.updater, which the app reads to register the updater, and has the bundler make and
      # sign the update bundles (.app.tar.gz, the NSIS and MSI installers, the AppImage).
      - name: Updater (when the signing secrets are set)
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "Updater off: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD and TAURI_UPDATER_PUBKEY are not all set."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file="$RUNNER_TEMP/updater.json"
          # Windows (Git Bash): D:/a/_temp/updater.json, a path both node and the Tauri CLI read.
          if command -v cygpath >/dev/null 2>&1; then file=$(cygpath -m "$file"); fi
          node -e '
            const { writeFileSync } = require("node:fs")
            const updater = {
              pubkey: process.env.TAURI_UPDATER_PUBKEY.trim(),
              endpoints: [process.env.ENDPOINT],
              // Each signature carries the version it was signed for (Tauri CLI 2.12); an update
              // whose signed version differs from latest.json is refused, so an old signed build
              // cannot be offered as a new one.
              requireSignedVersion: true,
            }
            writeFileSync(process.argv[1], JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater } }))
          ' "$file"
          echo "Updater on: $ENDPOINT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "args=--config $file" >> "$GITHUB_OUTPUT"

      - name: Build the app and installers
        id: tauri
        uses: tauri-apps/tauri-action@v0
        # Typical: 5-7 minutes on Linux and Windows, about 23 on the Intel Mac runners.
        timeout-minutes: 50
        # A failure here is retried once by the next step.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows: aws-lc-sys (rustls) uses its prebuilt assembly when NASM is not installed.
          AWS_LC_SYS_PREBUILT_NASM: "1"
          # The Tauri app's webview loads the React UI (frontend/dist); the server embeds the nsh
          # web build by default (crates/server/build.rs).
          STELLARATOR_WEB_UI: react
          # Signs the update bundles. Read only when the updater step turned the updater on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # Each overlay is `--config <file>` or empty; the CLI merges them in order.
          args: --target ${{ matrix.target }} ${{ steps.glass.outputs.args }} ${{ steps.updater.outputs.args }}
          includeUpdaterJson: ${{ steps.updater.outputs.enabled == 'true' }}
          # Releases only: upload into the draft release. Empty otherwise, so nothing is uploaded.
          releaseId: ${{ needs.release.outputs.id }}
          # The download URLs in latest.json name this tag instead of /latest/, so an update
          # always downloads the files its signatures were made for. Only set with releaseId
          # (a tag without one would make tauri-action create a release).
          tagName: ${{ needs.release.outputs.id && needs.release.outputs.tag || '' }}

      # The upload to the release can fail on a network error after a long build ("Connect Timeout
      # Error" once ended a 30-minute Apple Silicon build). The retry finds everything compiled, so
      # it only bundles and uploads again; tauri-action replaces assets that already exist. A real
      # build error fails again here and fails the job.
      - name: Retry the build and upload
        if: steps.tauri.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_LC_SYS_PREBUILT_NASM: "1"
          STELLARATOR_WEB_UI: react
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} ${{ steps.glass.outputs.args }} ${{ steps.updater.outputs.args }}
          includeUpdaterJson: ${{ steps.updater.outputs.enabled == 'true' }}
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ needs.release.outputs.id && needs.release.outputs.tag || '' }}

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: stellarator-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  publish:
    name: Publish the release
    if: needs.release.outputs.id != ''
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      # Each build adds its platforms to latest.json by downloading it, adding to it and uploading
      # it again, so two builds that finish together can drop each other's entries. With every
      # build done, add any platform that has a signature in the release but no entry. Nothing
      # to do when the updater is off (no latest.json).
      - name: Complete latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | "\(.id) \(.name)"')
          json_id=$(awk '$2 == "latest.json" { print $1 }' <<<"$assets")
          if [ -z "$json_id" ]; then
            echo "No latest.json in the release: the updater is off."
            exit 0
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$json_id" > latest.json
          added=0
          while read -r sig_id sig_name; do
            # The platform keys the updater looks up (os-arch, then os-arch-installer), as
            # tauri-action writes them: the MSI and the AppImage are the plain os-arch entries.
            case "$sig_name" in
              *aarch64*.app.tar.gz.sig) keys="darwin-aarch64 darwin-aarch64-app" ;;
              *.app.tar.gz.sig) keys="darwin-x86_64 darwin-x86_64-app" ;;
              *-setup.exe.sig) keys="windows-x86_64-nsis" ;;
              *.msi.sig) keys="windows-x86_64 windows-x86_64-msi" ;;
              *.AppImage.sig) keys="linux-x86_64 linux-x86_64-appimage" ;;
              *.deb.sig) keys="linux-x86_64-deb" ;;
              *) continue ;;
            esac
            for key in $keys; do
              if jq -e --arg k "$key" '.platforms[$k]' latest.json > /dev/null; then continue; fi
              signature=$(gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$sig_id")
              url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${sig_name%.sig}"
              jq --arg k "$key" --arg s "$signature" --arg u "$url" '.platforms[$k] = {signature: $s, url: $u}' latest.json > latest.tmp
              mv latest.tmp latest.json
              echo "Added $key ($url)"
              added=$((added + 1))
            done
          done < <(grep '\.sig$' <<<"$assets")
          jq -r '.platforms | keys[]' latest.json
          if [ "$added" -eq 0 ]; then
            echo "latest.json lists every platform."
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$json_id" --silent
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=latest.json" > /dev/null
          echo "Uploaded latest.json with $added added entries."

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # tag_name must be sent, or GitHub drops the draft's tag (see the release job).
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
            -f tag_name="$TAG" -F draft=false -f make_latest=true --jq '"Published " + .html_url'
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[] | "\(.name)  \(.size)"'
