[package]
name = "stellarator-desktop"
# Keep equal to the root workspace's version; the desktop workflow checks it.
version = "0.2.0"
description = "Stellarator desktop app: the Stellarator server and its web UI in one native window"
edition = "2021"
license = "MIT"
rust-version = "1.80"
publish = false

# Its own workspace, so Tauri's dependencies stay out of the server builds (the root workspace
# excludes desktop/). Builds go to desktop/src-tauri/target.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
getrandom = "0.3"
stellarator-core = { path = "../../crates/core" }
stellarator-server = { path = "../../crates/server" }
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tracing = "0.1"
